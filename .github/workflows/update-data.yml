name: 更新K线数据

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 1-3 * * 1-5'
    - cron: '*/5 5-7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_actions.txt -q

      - name: Run data update
        run: python update_data_pages.py

      - name: Commit and push changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add kline_data/
          if git diff --cached --quiet; then
            echo "无数据变更，跳过提交"
          else
            git commit -m "自动更新K线数据 $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          fi
