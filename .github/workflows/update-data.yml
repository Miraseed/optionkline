name: 更新K线数据

# 只在收盘后提交数据（一天两次），避免交易时段每几分钟推一次数据
# 把 GitHub Pages 的一次次构建顶掉，导致线上页面永远停留在旧版本。
# 实时数据由沙箱内服务（server.py）提供，GitHub 这里只做每日兜底归档。
on:
  schedule:
    # 日盘收盘后: UTC 07:20 = 北京 15:20
    - cron: '20 7 * * 1-5'
    # 夜盘收盘后: UTC 15:10 = 北京 23:10（铁矿石 21:00-23:00）
    - cron: '10 15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_actions.txt -q

      - name: Run data update
        run: python update_data_pages.py

      - name: Run options update (IV/PCR/微笑/期限结构, 失败不阻断)
        run: python update_options.py || true

      - name: Commit and push changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add kline_data/
          if git diff --cached --quiet; then
            echo "无数据变更，跳过提交"
          else
            git commit -m "自动更新K线数据 $(date '+%Y-%m-%d %H:%M:%S')"
            # 并发跑时远端可能已被更新, 先 rebase 再推
            git pull --rebase origin main || true
            git push
          fi
