name: pages-keeper
# GitHub 对 schedule 事件有严重节流: 配置 */5 的定时任务实测常被推迟到约每小时一次,
# 页面数据因此滞后数十分钟。本工作流在交易时段内常驻, 每 10 分钟主动 dispatch
# deploy-site, 把 GitHub Pages 的数据延迟压到 10 分钟以内。
# 说明: deploy-site 单次约 5~6 分钟, 间隔必须大于其耗时, 否则 cancel-in-progress 会互相取消。
on:
  workflow_dispatch:
  schedule:
    # 每小时启动一次常驻任务(日盘/夜盘各覆盖), 单个任务最长运行 5h50m
    - cron: "0 1 * * 1-5"
    - cron: "0 5 * * 1-5"
    - cron: "0 13 * * 1-5"
permissions:
  actions: write
  contents: read
concurrency:
  group: pages-keeper
  cancel-in-progress: true
jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Dispatch deploy-site during trading hours
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import datetime as dt, os, subprocess, time
          BJ = dt.timezone(dt.timedelta(hours=8))
          WINDOWS = [((9, 0), (15, 5)), ((21, 0), (23, 5))]
          deadline = time.time() + 5.8 * 3600

          def in_window(now):
              if now.weekday() >= 5:
                  return False
              hm = (now.hour, now.minute)
              return any(lo <= hm <= hi for lo, hi in WINDOWS)

          def dispatch():
              r = subprocess.run(["gh", "workflow", "run", "deploy-site.yml", "--ref", "main"],
                                 capture_output=True, text=True)
              print(dt.datetime.now(BJ).strftime("%H:%M:%S"),
                    "dispatch ok" if r.returncode == 0 else f"dispatch fail: {r.stderr.strip()[:200]}",
                    flush=True)

          while time.time() < deadline:
              now = dt.datetime.now(BJ)
              if in_window(now):
                  dispatch()
                  time.sleep(600)
              else:
                  time.sleep(120)
          EOF
