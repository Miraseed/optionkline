<style>

<script>
// ==================== 配置 ====================
const UNDERLYINGS = [
  { code: "510050", name: "上证50ETF",  decimal_places: 3, tencent: "sh510050" },
  { code: "510300", name: "沪深300ETF", decimal_places: 3, tencent: "sh510300" },
  { code: "588000", name: "科创50ETF",  decimal_places: 3, tencent: "sh588000" },
  { code: "159915", name: "创业板ETF",  decimal_places: 3, tencent: "sz159915" },
  { code: "510500", name: "中证500ETF", decimal_places: 3, tencent: "sh510500" },
  { code: "000852", name: "中证1000",   decimal_places: 2, tencent: "sh000852" },
  { code: "I0",     name: "铁矿石主连", decimal_places: 1, tencent: "" },
];
// 密码 option2024 的 base64 编码（基础门禁，非安全加密）
const PASSWORD_ENC = "b3B0aW9uMjAyNA==";
const PERIODS = ["daily", "weekly", "monthly"];

// ==================== 登录 ====================
async function doLogin() {
  const pwd = document.getElementById("password").value;
  if (!pwd) return;
  const btn = document.getElementById("login-btn");
  btn.disabled = true; btn.textContent = "登录中...";
  const ok = btoa(unescape(encodeURIComponent(pwd))) === PASSWORD_ENC;
  if (ok) {
    localStorage.setItem("auth", "1");
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app").style.display = "block";
    await initApp();
  } else {
    document.getElementById("login-error").style.display = "block";
    btn.disabled = false; btn.textContent = "登 录";
  }
}
document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

function doLogout() {
  localStorage.removeItem("auth");
  location.reload();
}

// ==================== 交易时间判断（前端） ====================
function isTradingDay(dt) { dt = dt || new Date(); const d = dt.getDay(); return d >= 1 && d <= 5; }
function isTradingHours(dt) {
  dt = dt || new Date();
  if (!isTradingDay(dt)) return false;
  const h = dt.getHours(), m = dt.getMinutes();
  const mins = h * 60 + m;
  return (mins >= 570 && mins <= 690) || (mins >= 780 && mins <= 900); // 9:30-11:30 / 13:00-15:00
}
function nextRefreshInfo() {
  const now = new Date();
  const mins = now.getHours() * 60 + now.getMinutes();
  if (isTradingHours(now)) return "交易时间内，定时自动刷新";
  if (isTradingDay(now)) {
    if (mins < 570) return "非交易时段，9:30后开始自动刷新";
    if (mins < 780) return "午间休市，13:00后继续自动刷新";
    return "今日交易已结束";
  }
  return "非交易日，数据仅供查看";
}

// ==================== 数据加载 ====================
let allData = {};       // {code: {daily:[], weekly:[], monthly:[]}}
let peData = {};        // {code: [{date, pe_ttm, quantile}]}
let peLatest = {};      // {code: {pe_ttm, percentile}}
let currentCode = null;
let currentPeriod = "daily";
let chart = null;
let tooltipSide = "none";   // 悬浮窗当前所在侧："left"/"right"/"none"（用于横轴标签动态避让）
let refreshTimer = null;
let countdownInterval = null;
let refreshMs = 300000;
let nextRefreshAt = 0;

const RISK_COLORS = {"-3":"risk3","-2":"risk2","-1":"risk1","0":"risk0","1":"risk-1","2":"risk-2","3":"risk-3"};
const RISK_BG = {"-3":"#9ae6b4","-2":"#c6f6d5","-1":"#f0fff4","0":"#e2e8f0","1":"#fffaf0","2":"#feebc8","3":"#fed7d7"};

function fmtPct(v) { return (v===null||v===undefined) ? "--" : (v*100).toFixed(2)+"%"; }
function getDecimals(code) { const u = UNDERLYINGS.find(x=>x.code===code); return u ? (u.decimal_places||3) : 3; }
function fmtNum(v, d) { if (v===null||v===undefined) return "--"; if (d===undefined) d = currentCode?getDecimals(currentCode):3; return Number(v).toFixed(d); }
function fmtVol(v) { if (v===null||v===undefined) return "--"; v=Number(v); if(v>=1e8) return (v/1e8).toFixed(2)+"亿"; if(v>=1e4) return (v/1e4).toFixed(0)+"万"; return v.toLocaleString(); }
function showToast(msg, type) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = `toast show ${type||"info"}`;
  setTimeout(() => t.className = "toast", 3000);
}

// 计算 MA 均线
function calcMA(closes, n) {
  const result = [];
  for (let i = 0; i < closes.length; i++) {
    if (i < n - 1) { result.push(null); continue; }
    let sum = 0;
    for (let j = i - n + 1; j <= i; j++) sum += closes[j];
    result.push(round2(sum / n));
  }
  return result;
}
function round2(v) { return Math.round(v * 10000) / 10000; }

// 为K线日期匹配PE值和百分位
function getPEForDates(code, dates) {
  const records = peData[code];
  if (!records || !records.length) return { peTtm: null, pePercentile: null };
  const sorted = [...records].sort((a, b) => a.date.localeCompare(b.date));
  const peDates = sorted.map(r => r.date);
  const peValues = sorted.map(r => r.pe_ttm);
  // 计算每个PE值的历史百分位
  const sortedVals = [...peValues].sort((a, b) => a - b);
  const n = sortedVals.length;
  const pctOf = {};
  for (const v of peValues) {
    if (pctOf[v] === undefined) {
      let rank = 0;
      for (const sv of sortedVals) if (sv <= v) rank++;
      pctOf[v] = round1(rank / n * 100);
    }
  }
  const peTtm = [], pePercentile = [];
  let idx = 0;
  for (const d of dates) {
    while (idx < peDates.length && peDates[idx] <= d) idx++;
    if (idx > 0) {
      const v = peValues[idx - 1];
      peTtm.push(v);
      pePercentile.push(pctOf[v]);
    } else { peTtm.push(null); pePercentile.push(null); }
  }
  return { peTtm, pePercentile };
}
function round1(v) { return Math.round(v * 10) / 10; }

// 计算每个标的最新PE及百分位
function calcPELatest() {
  peLatest = {};
  for (const u of UNDERLYINGS) {
    const records = peData[u.code];
    if (!records || !records.length) continue;
    const sorted = [...records].sort((a, b) => a.date.localeCompare(b.date));
    const latest = sorted[sorted.length - 1];
    let percentile;
    if (latest.quantile !== undefined && latest.quantile !== null) {
      percentile = latest.quantile;
    } else {
      const allVals = sorted.map(r => r.pe_ttm).sort((a, b) => a - b);
      let rank = 0;
      for (const v of allVals) if (v <= latest.pe_ttm) rank++;
      percentile = round1(rank / allVals.length * 100);
    }
    peLatest[u.code] = { pe_ttm: latest.pe_ttm, percentile: percentile };
  }
}

async function loadJSON(url) {
  const sep = url.includes("?") ? "&" : "?";
  const resp = await fetch(url + sep + "_t=" + Date.now(), {
    cache: "no-store",
    headers: { "Cache-Control": "no-cache", "Pragma": "no-cache", "Expires": "0" }
  });
  if (!resp.ok) throw new Error(`${resp.status}`);
  return resp.json();
}

// ==================== 实时行情（腾讯财经API） ====================
// 腾讯API不检查Referer，可通过script tag在GitHub Pages上跨域加载（无403/CORS问题）
// 格式: v_sh510050="1~上证50ETF华夏~510050~2.926~2.918~2.907~7396780~..."
// 字段(以~分隔): [3]=最新价 [4]=昨收 [5]=今开 [6]=成交量 [32]=涨跌 [33]=涨跌幅 [34]=最高 [35]=最低

async function fetchAllRealtime() {
  const results = {};
  const tencentCodes = UNDERLYINGS.filter(u => u.tencent).map(u => u.tencent);
  if (tencentCodes.length === 0) return results;

  return new Promise((resolve) => {
    const url = `https://qt.gtimg.cn/q=${tencentCodes.join(",")}`;
    const script = document.createElement("script");
    script.charset = "gbk";
    let done = false;

    function cleanup() {
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    function parseAndStore() {
      for (const u of UNDERLYINGS) {
        if (!u.tencent) continue;
        const varName = "v_" + u.tencent;
        const raw = window[varName];
        if (raw && raw.length > 20 && raw !== '1') {
          const fields = raw.split("~");
          if (fields.length > 35) {
            const price = parseFloat(fields[3]);
            const prevClose = parseFloat(fields[4]);
            const open = parseFloat(fields[5]);
            const volume = parseFloat(fields[6]);
            const high = parseFloat(fields[34]);
            const low = parseFloat(fields[35]);
            const changePct = parseFloat(fields[33]);
            if (price > 0) {
              results[u.code] = {
                price: price,
                open: open || price,
                high: high > 0 ? high : price,
                low: low > 0 ? low : price,
                volume: volume || 0,
                change_pct: changePct || (prevClose > 0 ? ((price - prevClose) / prevClose * 100) : 0),
              };
            }
          }
        }
      }
    }

    script.onload = function() {
      done = true;
      parseAndStore();
      cleanup();
      resolve(results);
    };

    script.onerror = function() { cleanup(); done = true; resolve(results); };
    document.head.appendChild(script);
    setTimeout(function() {
      if (!done) {
        cleanup();
        parseAndStore();
        resolve(results);
      }
    }, 5000);
  });
}

function applyRealtimeToData(rtData) {
  let updated = false;
  for (const u of UNDERLYINGS) {
    const rt = rtData[u.code];
    if (!rt || rt.price == null || rt.price <= 0) continue;
    const d = allData[u.code];
    if (!d) continue;
    for (const p of PERIODS) {
      const arr = d[p];
      if (!arr || arr.length === 0) continue;
      const last = arr[arr.length - 1];
      const today = new Date().toISOString().slice(0, 10);
      if (last.date === today) {
        last.close = rt.price;
        if (rt.high > last.high) last.high = rt.high;
        if (rt.low < last.low || last.low === last.open) last.low = rt.low;
        last.volume = rt.volume || last.volume;
      } else if (last.date < today) {
        arr.push({
          date: today,
          open: rt.open || rt.price,
          high: rt.high || rt.price,
          low: rt.low || rt.price,
          close: rt.price,
          volume: rt.volume || 0,
        });
        if (p === "daily" && arr.length > 1500) arr.shift();
      }
    }
    updated = true;
  }
  return updated;
}

async function loadAllData() {
  const promises = [];
  for (const u of UNDERLYINGS) {
    for (const p of PERIODS) {
      promises.push(
        loadJSON(`kline_data/${u.code}_${p}.json`)
          .then(data => ({ code: u.code, period: p, data }))
          .catch(() => ({ code: u.code, period: p, data: [] }))
      );
    }
  }
  const results = await Promise.all(promises);
  allData = {};
  for (const u of UNDERLYINGS) allData[u.code] = {};
  for (const r of results) {
    allData[r.code][r.period] = r.data;
  }
  // 加载PE数据
  try {
    peData = await loadJSON("kline_data/pe_data.json");
  } catch { peData = {}; }
  calcPELatest();

  // 更新状态
  document.getElementById("last-update").textContent = new Date().toLocaleString("zh-CN", { hour12: false });
  const badge = document.getElementById("status-badge");
  if (isTradingHours()) {
    badge.textContent = "🟢 交易中";
    badge.className = "status-badge status-trading";
  } else {
    badge.textContent = isTradingDay() ? "⚪ 非交易时段" : "⚪ 非交易日";
    badge.className = "status-badge status-closed";
  }
}

// ==================== 渲染 ====================
function renderSummary() {
  const grid = document.getElementById("summary-grid");
  let html = "";
  for (const u of UNDERLYINGS) {
    const code = u.code;
    const d = allData[code] || {};
    const daily = d.daily || [], weekly = d.weekly || [], monthly = d.monthly || [];
    const lastDaily = daily.length ? daily[daily.length-1] : null;
    const lastWeekly = weekly.length ? weekly[weekly.length-1] : null;
    const lastMonthly = monthly.length ? monthly[monthly.length-1] : null;
    const latest = lastDaily;
    const close = latest ? fmtNum(latest.close, u.decimal_places||3) : "--";
    const chg = latest && latest.close_change !== null ? fmtPct(latest.close_change) : "--";
    const chgCls = latest && latest.close_change !== null ? (latest.close_change >= 0 ? "pct-pos" : "pct-neg") : "";
    function ratingTag(rec) {
      if (!rec) return '<span class="rating-tag" style="background:#a0aec0">--</span>';
      const s = rec.risk_score;
      const bg = RISK_BG[String(s)] || "#a0aec0";
      const color = s >= 2 ? "#c53030" : s <= -2 ? "#22543d" : "#333";
      return `<span class="rating-tag" style="background:${bg};color:${color}">${rec.risk_label}</span>`;
    }
    function peTag() {
      // PE 数据源不稳定（legulegu 反爬、csindex 仅近 20 天且缺创业板指），暂屏蔽显示
      return '';
    }
    html += `
      <div class="etf-card ${code===currentCode?'active':''}" onclick="selectETF('${code}')">
        <div class="etf-card-title">
          <span>${u.name} (${code})</span>
          <span class="card-right"><span class="${chgCls}">${close} ${chg}</span></span>
        </div>
        <div class="etf-card-rating">
          <span class="rating-left">日:${ratingTag(lastDaily)} 周:${ratingTag(lastWeekly)} 月:${ratingTag(lastMonthly)}</span>
          ${peTag()}
        </div>
      </div>`;
  }
  grid.innerHTML = html;
}

function renderStats(dates, values, riskScores) {
  if (!dates.length) return;
  const highs = values.map(v => v[3]), lows = values.map(v => v[2]), closes = values.map(v => v[1]);
  const highPrice = Math.max(...highs), lowPrice = Math.min(...lows);
  const startPrice = closes[0], endPrice = closes[closes.length-1];
  const change = (endPrice - startPrice) / startPrice;
  const changeCls = change >= 0 ? "pct-pos" : "pct-neg";
  const changeSign = change >= 0 ? "+" : "";
  const total = dates.length;
  const riskCount = riskScores.filter(s => s === 3).length;
  const chanceCount = riskScores.filter(s => s === -3).length;
  const periodName = { daily: "日K", weekly: "周K", monthly: "月K" }[currentPeriod];
  const decimals = getDecimals(currentCode);
  document.getElementById("stats-panel").innerHTML = `
    <div class="stats-title">【${periodName}统计】</div>
    <div class="stats-row"><span>数据条数: <b>${total}</b>条 (${dates[0]} ~ ${dates[dates.length-1]})</span></div>
    <div class="stats-row"><span>最高价: <b>${highPrice.toFixed(decimals)}</b></span><span>最低价: <b>${lowPrice.toFixed(decimals)}</b></span></div>
    <div class="stats-row"><span>期初价: <b>${startPrice.toFixed(decimals)}</b></span><span>期末价: <b>${endPrice.toFixed(decimals)}</b></span><span>涨幅: <b class="${changeCls}">${changeSign}${(change*100).toFixed(2)}%</b></span></div>
    <div class="stats-row"><span class="risk-high">巨大风险: ${riskCount}天 (${(riskCount/total*100).toFixed(1)}%)</span><span class="risk-low">巨大机会: ${chanceCount}天 (${(chanceCount/total*100).toFixed(1)}%)</span></div>
  `;
}

// ==================== 刷新 ====================
async function manualRefresh() {
  const btn = document.getElementById("refresh-btn");
  btn.disabled = true; btn.textContent = "刷新中...";
  showToast("正在重新加载数据...", "info");
  try {
    await loadAllData();
    const rtData = await fetchAllRealtime();
    applyRealtimeToData(rtData);
    renderSummary();
    if (currentCode) { renderDetail(); renderChart(); }
    showToast("数据已更新（含实时行情）！", "success");
  } catch (e) {
    showToast("刷新失败: " + e.message, "error");
  } finally {
    btn.disabled = false; btn.textContent = "🔄 刷新";
  }
}

function setRefreshInterval(seconds) {
  seconds = parseInt(seconds);
  refreshMs = seconds * 1000;
  localStorage.setItem("refreshInterval", String(seconds));
  nextRefreshAt = Date.now() + refreshMs;
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(autoRefreshTask, refreshMs);
  const label = seconds < 60 ? seconds + " 秒" : seconds / 60 + " 分钟";
  showToast(`自动刷新间隔已设为 ${label}`, "success");
}

function dataHash() {
  let h = "";
  for (const code in allData) {
    const d = allData[code];
    for (const p of PERIODS) {
      const arr = d[p] || [];
      if (arr.length) h += code + p + arr.length + arr[arr.length-1].date + arr[arr.length-1].close;
    }
  }
  return h;
}

async function autoRefreshTask() {
  try {
    const oldHash = dataHash();
    await loadAllData();
    const rtData = await fetchAllRealtime();
    applyRealtimeToData(rtData);
    const newHash = dataHash();
    renderSummary();
    if (currentCode) { renderDetail(); renderChart(); }
    if (oldHash !== newHash) {
      showToast("数据有更新！", "success");
    } else {
      showToast("数据暂无变化（等待GitHub Actions更新）", "info");
    }
  } catch (e) {
    showToast("自动刷新失败: " + e.message, "error");
  }
  nextRefreshAt = Date.now() + refreshMs;
}

function startAutoRefresh() {
  const saved = parseInt(localStorage.getItem("refreshInterval")) || 300;
  document.getElementById("interval-select").value = String(saved);
  refreshMs = saved * 1000;
  nextRefreshAt = Date.now() + refreshMs;
  if (refreshTimer) clearInterval(refreshTimer);
  if (countdownInterval) clearInterval(countdownInterval);
  refreshTimer = setInterval(autoRefreshTask, refreshMs);
  countdownInterval = setInterval(() => {
    const remain = Math.max(0, Math.ceil((nextRefreshAt - Date.now()) / 1000));
    const m = Math.floor(remain / 60), s = remain % 60;
    document.getElementById("countdown").textContent = `下次刷新: ${m}:${String(s).padStart(2,'0')}`;
  }, 1000);
  setInterval(() => {
    document.getElementById("server-time").textContent = new Date().toLocaleString("zh-CN", { hour12: false });
  }, 1000);
}

// ==================== 初始化 ====================
async function initApp() {
  try {
    await loadAllData();
    const rtData = await fetchAllRealtime();
    applyRealtimeToData(rtData);
    renderSummary();
    startAutoRefresh();
    const first = UNDERLYINGS[0];
    if (first) selectETF(first.code);
  } catch (e) {
    console.error(e);
    showToast("数据加载失败: " + e.message, "error");
  }
}

// 页面加载时检查登录状态
window.addEventListener("DOMContentLoaded", () => {
  if (localStorage.getItem("auth") === "1") {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app").style.display = "block";
    initApp();
  }
});
</script>
